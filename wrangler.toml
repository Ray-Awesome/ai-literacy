name = "ailiteracy"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "ailit-db"
database_id = "814df798-02f0-46d0-be2f-773980be4076"

[[queues.producers]]
binding = "NEWSLETTER_QUEUE"
queue = "ailit-newsletter-send"

[vars]
ADMIN_EMAIL = ""
NEWSLETTER_FROM = "AILIT <newsletter@news.ailiteracy.or.kr>"
PUBLIC_SITE_URL = "https://ailiteracy.or.kr"

[observability]
enabled = true
