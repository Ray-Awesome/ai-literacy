name = "ailit-newsletter-delivery"
main = "src/newsletter-worker.js"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ailit-db"
database_id = "814df798-02f0-46d0-be2f-773980be4076"

[[queues.consumers]]
queue = "ailit-newsletter-send"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "ailit-newsletter-dead-letter"

[[queues.consumers]]
queue = "ailit-newsletter-dead-letter"
max_batch_size = 1
max_retries = 1
